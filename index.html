<!DOCTYPE html>
<html>
<head>
    <title>AI Code Review Tool</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f6f9;
        }

        h2 {
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px;
            width: 100%;
            background: #007BFF;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .card {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .bugs { border-left: 5px solid #e74c3c; }
        .performance { border-left: 5px solid #f39c12; }
        .security { border-left: 5px solid #e67e22; }
        .suggestions { border-left: 5px solid #2ecc71; }

        h3 {
            margin-bottom: 10px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 6px;
        }

        .loading {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🚀 AI Code Review Tool</h2>

    <label>Architecture:</label>
    <input id="architecture" placeholder="Microservices, scalable, secure">

    <label>Language:</label>
    <input id="language" placeholder="Python / Java">

    <label>Guidelines:</label>
    <textarea id="guidelines" rows="3" placeholder="Logging, exception handling..."></textarea>

    <label>Code:</label>
    <textarea id="code" rows="10" placeholder="Paste your code here"></textarea>

    <button onclick="submitReview()">Review Code</button>

    <div id="loading" class="loading"></div>
    <div id="error" class="error"></div>

    <div id="result"></div>

</div>

<script>

async function submitReview() {

    document.getElementById("loading").innerText = "⏳ Analyzing...";
    document.getElementById("result").innerHTML = "";
    document.getElementById("error").innerText = "";

    const data = {
        architecture: document.getElementById("architecture").value,
        language: document.getElementById("language").value,
        guidelines: document.getElementById("guidelines").value,
        code: document.getElementById("code").value
    };

    try {
        const response = await fetch("http://127.0.0.1:8000/review", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        if (!response.ok) {
            throw new Error("Server error");
        }

        const result = await response.json();

        if (result.error) {
            document.getElementById("error").innerText = result.error;
        } else {
            displayResult(result);
        }

    } catch (error) {
        document.getElementById("error").innerText = "❌ Unable to connect to backend";
    }

    document.getElementById("loading").innerText = "";
}


function createSection(title, items, className) {
    if (!items || items.length === 0) return "";

    return `
        <div class="card ${className}">
            <h3>${title}</h3>
            <ul>
                ${items.map(i => `<li>${i}</li>`).join("")}
            </ul>
        </div>
    `;
}


function displayResult(data) {
    const container = document.getElementById("result");

    container.innerHTML = `
        ${createSection("🐞 Bugs", data.bugs, "bugs")}
        ${createSection("⚡ Performance Issues", data.performance, "performance")}
        ${createSection("🔒 Security Risks", data.security, "security")}
        ${createSection("💡 Suggestions", data.suggestions, "suggestions")}
    `;
}

</script>

</body>
</html>
